[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/hivepaas/tracewing"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tracewing-store = { path = "crates/store" }
tracewing-proxy = { path = "crates/proxy" }
tracewing-system = { path = "crates/system" }
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hudsucker = { version = "0.25.0", features = ["rcgen-ca", "rustls-client", "http2", "decoder"] }
keyring = "4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
rustls-platform-verifier = "0.7"
flate2 = "1"
brotli = "9"
zstd = "0.14"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustls-native-certs = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.11"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
