[package]
name = "tracewing"
description = "A native HTTP(S) debugging proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["wayland"]
# Linux window system backends.
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
# Drawing with no display, for the UI tests and their pictures (Linux only).
headless = ["gpui_platform/test-support", "dep:gpui_wgpu", "dep:image"]

[dependencies]
tracewing-proxy.workspace = true
tracewing-store.workspace = true
tracewing-system.workspace = true
# The same GPUI snapshot as packwing and shellwing.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http.workspace = true
memchr = "2"
memmap2 = "0.9"
rusqlite.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-segmentation = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
tracewing-dev = { path = "../dev" }
