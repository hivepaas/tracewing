name: Release

# A tag vX.Y.Z (or vX.Y.Z-betaN) builds tracewing, packages it
# (scripts/package_*.sh) and makes a draft release on GitHub with the files and
# their SHA-256. Nothing reaches anybody until the draft is published by hand
# (docs/releasing.md).
#
# A pull request that changes the packaging, or a run by hand (Actions >
# Release > Run workflow), builds and packages the branch the same way and
# keeps the files as the run's artifacts: a rehearsal, with no release.
#
# macOS is still to come: a row for this matrix and a packaging script, and
# the download page has its names already.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - about.toml
      - scripts/package_*.sh
      - scripts/check_linux_package.sh
      - scripts/check_windows_installer.ps1
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the workspace's version, or the release would name a
      # version the program itself does not.
      - name: The tag and Cargo.toml agree
        id: v
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu GitHub has: the glibc it links is the oldest the
          # packages run on (2.35: Ubuntu 22.04, Debian 12).
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm }
          - { name: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # As in ci.yml, where Ubuntu's mirrors once held the step for 15 minutes:
      # each download gives up sooner and the whole is tried again. dpkg-dev,
      # rpm and cpio are what the packaging itself needs.
      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; packaging)"
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          for try in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends \
              build-essential pkg-config libfontconfig-dev libfreetype-dev \
              libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libvulkan-dev libdbus-1-dev libzstd-dev \
              dpkg-dev rpm cpio desktop-file-utils && exit 0
            echo "apt failed ($try of 3)"
            sleep 10
          done
          exit 1

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      # The third-party licenses every package holds.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build
        run: cargo build --release --locked -p tracewing

      - name: Package
        shell: bash
        run: scripts/package_${{ runner.os == 'Windows' && 'windows' || 'linux' }}.sh

      # What each holds, then the .deb installed here and the program run from
      # it, and the .rpm in a Fedora container.
      - name: Check, install and run (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/check_linux_package.sh --install dist/tracewing_*.deb
          scripts/check_linux_package.sh --install dist/tracewing_*.rpm

      # The installer, quiet: for the user and for everyone, again over itself,
      # and uninstalled.
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/check_windows_installer.ps1 (Get-Item dist/tracewing_*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: tracewing-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    needs: [version, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA-256
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The release's notes are docs/releases/vX.Y.Z.md; a draft, published by
      # hand once it is checked.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "::error::no $notes"; exit 1; }
          prerelease=()
          case "$TAG" in *-beta*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft "${prerelease[@]}" \
            --title "tracewing $VERSION" --notes-file "$notes" --verify-tag
