name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # macOS and Windows minutes cost more, so they run only when started by hand
  # (Actions > CI > Run workflow); pushes and pull requests build Linux only.
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [all, macos, windows, linux]
        default: all

# A run started by hand is its own group: a push to main must not cancel the
# macOS and Windows minutes already spent, nor that run cancel the push's.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: >-
          ${{ fromJSON(
          inputs.platforms == 'all' && '["linux-x86_64","macos-arm64","windows-x86_64"]' ||
          inputs.platforms == 'macos' && '["macos-arm64"]' ||
          inputs.platforms == 'windows' && '["windows-x86_64"]' ||
          '["linux-x86_64"]') }}
    runs-on: >-
      ${{ startsWith(matrix.name, 'macos') && 'macos-latest' ||
      startsWith(matrix.name, 'windows') && 'windows-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's mirrors once held this step for 15 minutes, a package at a time:
      # each download gives up sooner, the whole is tried again, and then fails.
      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts)"
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          for try in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends \
              build-essential pkg-config libfontconfig-dev libfreetype-dev \
              libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libvulkan-dev libdbus-1-dev libzstd-dev && exit 0
            echo "apt failed ($try of 3)"
            sleep 10
          done
          exit 1

      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The translations follow the code's English (crates/i18n/locales).
      - name: Translations
        if: runner.os == 'Linux'
        run: python3 scripts/i18n.py check

      # --locked everywhere a dependency is resolved: a Cargo.lock that
      # does not match the manifests is a build that cannot be repeated,
      # and it should be caught here rather than at a tag, where the
      # release jobs build with --locked and stop.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --release -- -D warnings

      # They run in the window job below, on Linux; everywhere else they
      # should at least build.
      - name: Clippy (window tests)
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p tracewing --all-targets --release --features headless -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --release

  # The tests that draw the window. They were left out of CI for wanting a
  # GPU; Mesa's software Vulkan gives them one, so a change that moves what a
  # window test asserts is caught here rather than on someone's machine.
  window:
    name: linux-window-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI, and Vulkan with no GPU)"
        timeout-minutes: 10
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          for try in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends \
              build-essential pkg-config libfontconfig-dev libfreetype-dev \
              libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libvulkan-dev libdbus-1-dev libzstd-dev mesa-vulkan-drivers && exit 0
            echo "apt failed ($try of 3)"
            sleep 10
          done
          exit 1

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-window

      # A runner has no GPU, so Mesa's lavapipe draws instead. Its file is
      # named differently from one Mesa build to the next, so it is looked up
      # rather than guessed, and saying which driver outright beats taking
      # whichever the loader happens to find.
      # One test is left out, and only one: `each_flow_says_which_program_sent_it`
      # asks the kernel which process holds a socket, and that is only
      # answerable while the socket is open. The curl it asks about has
      # already exited, so whether the answer arrives depends on how quickly
      # the lookup thread gets its turn. Measured: it failed once in three
      # runs here, and not once in twenty on a developer's machine, where it
      # stays. Widening its deadline would only hide a race that is real.
      - name: Window tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "drawing with $icd"
          VK_ICD_FILENAMES=$icd cargo test --locked -p tracewing --release --features headless \
            -- --skip each_flow_says_which_program_sent_it

      # What the tests drew, to look at when one of them fails.
      - name: The pictures they drew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-test-shots
          path: target/shots/
          if-no-files-found: ignore
          retention-days: 7

  # The tests that change the computer they run on (crates/e2e,
  # docs/design/e2e.md): the system proxy, the trust stores, the packages,
  # the browsers. They run in containers made for it, Ubuntu with the .deb,
  # Chrome and Firefox, and Fedora with the .rpm, as an ordinary user who
  # reaches root through pkexec, once as GNOME and once as KDE. The binaries
  # built here run in both as they are.
  e2e:
    name: linux-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Linux packages (GPUI: Wayland, X11, Vulkan, fonts; packaging)"
        timeout-minutes: 10
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          for try in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends \
              build-essential pkg-config libfontconfig-dev libfreetype-dev \
              libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
              libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
              libvulkan-dev libdbus-1-dev libzstd-dev \
              dpkg-dev rpm cpio && exit 0
            echo "apt failed ($try of 3)"
            sleep 10
          done
          exit 1

      - name: Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-e2e

      # The licenses the packages hold, as in release.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Tests that change the computer
        run: scripts/e2e_linux.sh

      # S8 (docs/design/e2e.md): capture with no proxy settings, through a
      # real TUN device. The live tests make theirs in a network namespace of
      # their own, under `unshare --user --map-root-user`, which this
      # runner's AppArmor refuses until it is told not to; the runner is
      # thrown away after. Each test checks that its inner run reached the
      # end, so a refused namespace fails rather than passing empty.
      # A filter that matches nothing runs nothing and exits 0, so the run
      # picked by name is asked whether it ran one.
      - name: Capture without proxy settings
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo ip tuntap add dev tracewing-test mode tun user "$(id -u)"
          # Chrome's HTTP/3 through the adapter trusts the CA from an NSS
          # database the test makes; the runner has Chrome, not certutil.
          sudo apt-get install -y --no-install-recommends libnss3-tools
          cargo test --release --locked -p tracewing \
            --test local_live_linux --test local_live_http3 -- --ignored --test-threads=1 \
            2>&1 | tee live.log
          # That it *ran*. libtest writes `test <name> ... ` and then the
          # test's own stdout, so the `ok` lands on a line of its own and the
          # obvious `... ok$` can never match a test that prints anything --
          # this one prints the door's address. Whether it **passed** is
          # cargo's own exit status, which `pipefail` carries through `tee`.
          #
          # The second line is not redundant: a test left out by `--ignored`
          # going missing is written `test <name> ... ignored, <reason>`,
          # which starts exactly like the line above. A guard that only looks
          # for the name would therefore pass in precisely the case it exists
          # to catch.
          N='chromes_http3_goes_through_tracewing_on_a_real_adapter'
          grep -q "^test $N \.\.\." live.log
          ! grep -q "^test $N \.\.\. ignored" live.log
          cargo test --release --locked -p tracewing-proxy --lib -- --ignored --exact \
            tun_linux::tests::a_real_device_opens_once_and_its_read_can_be_stopped \
            2>&1 | tee tun.log
          grep -q '^test result: ok. 1 passed' tun.log

      # S3's last part: the systemd user timer putting the setting back by
      # itself once the app and its watchdog are both killed. The container
      # runs no systemd, so this runs on the runner, as its own user, with a
      # user manager kept up by linger and GNOME's setting in dconf. A skip
      # (no user manager) would pass empty, so the log is asked too.
      - name: The systemd timer
        shell: bash
        timeout-minutes: 10
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get $APT install -y --no-install-recommends \
            dconf-gsettings-backend gsettings-desktop-schemas dbus-user-session
          sudo touch /etc/tracewing-e2e-throwaway
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          export XDG_CURRENT_DESKTOP=GNOME GSETTINGS_BACKEND=dconf
          export TRACEWING_E2E=1 TRACEWING_E2E_BIN="$PWD/target/release/tracewing"
          systemctl --user is-system-running || true
          cargo test --release --locked -p tracewing-e2e --test recovery -- --exact \
            the_systemd_timer_puts_it_back_when_the_app_and_its_watchdog_are_killed \
            --nocapture 2>&1 | tee timer.log
          grep -q '^test result: ok. 1 passed' timer.log
          ! grep -q 'skipped:' timer.log
